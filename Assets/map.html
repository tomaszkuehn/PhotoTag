<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8"/>
<title>PhotoTag mapa</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<style>
    html, body { height: 100%; margin: 0; font-family: 'Segoe UI', sans-serif; }
    #map { height: 100%; }
    #toolbar {
        position: absolute; top: 8px; left: 56px; right: 8px; z-index: 1000;
        display: flex; gap: 6px;
    }
    #q {
        flex: 1; max-width: 420px; padding: 7px 10px;
        border: 1px solid #999; border-radius: 6px; font-size: 13px;
    }
    #toolbar button {
        padding: 7px 14px; border: 1px solid #888; border-radius: 6px;
        background: #fff; cursor: pointer; font-size: 13px;
    }
    #toolbar button:hover { background: #eef6ff; }
    #coords {
        position: absolute; bottom: 8px; left: 8px; z-index: 1000;
        background: rgba(255,255,255,.95); padding: 6px 10px; border-radius: 6px;
        font-family: Consolas, monospace; font-size: 13px;
    }
</style>
</head>
<body>
<div id="toolbar">
    <input id="q" placeholder="Szukaj miejsca lub adresu…"/>
    <button onclick="search()">Szukaj</button>
    <button onclick="openStreetView()">Street View ↗</button>
</div>
<div id="map"></div>
<div id="coords">Kliknij na mapie, aby wybrać lokalizację</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
    const map = L.map('map').setView([52.0, 21.0], 6);
    const streetLayer = L.layerGroup().addTo(map);
    const osm = L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19, attribution: '&copy; OpenStreetMap'
    });
    const sat = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
        maxZoom: 19, attribution: '&copy; Esri'
    });
    osm.addTo(map);
    L.control.layers({ 'Mapa (OSM)': osm, 'Satelita': sat }).addTo(map);

    let marker = null;

    function setMarker(lat, lng) {
        if (marker) {
            marker.setLatLng([lat, lng]);
        } else {
            marker = L.marker([lat, lng], { draggable: true }).addTo(map);
            marker.on('dragend', post);
        }
        post();
    }

    function post() {
        if (!marker) return;
        const ll = marker.getLatLng();
        document.getElementById('coords').textContent =
            ll.lat.toFixed(6) + ', ' + ll.lng.toFixed(6);
        if (window.chrome && window.chrome.webview) {
            window.chrome.webview.postMessage({ type: 'pick', lat: ll.lat, lng: ll.lng });
        }
    }

    map.on('click', e => setMarker(e.latlng.lat, e.latlng.lng));

    function setView(lat, lng, zoom) {
        map.setView([lat, lng], zoom || 13);
        setMarker(lat, lng);
    }

    async function search() {
        const q = document.getElementById('q').value.trim();
        if (!q) return;
        updateCoords('Szukam: ' + q + '…');

        let hit = await geocode(q);
        if (hit) {
            map.setView([hit.lat, hit.lon], 13);
            setMarker(hit.lat, hit.lon);
            return;
        }

        const n = await searchStreets(q);
        updateCoords(n > 0
            ? `Znaleziono ${n} odcinków ulic „${q}” (niebieskie linie; klik = postaw znacznik)`
            : `Nie znaleziono: ${q}`);
    }

    function updateCoords(text) {
        document.getElementById('coords').textContent = text;
    }

    async function geocode(q) {
        try {
            const b = map.getBounds();
            const vb = `viewbox=${b.getWest()},${b.getNorth()},${b.getEast()},${b.getSouth()}`;
            const r = await fetch('https://nominatim.openstreetmap.org/search?format=json&limit=1&' + vb + '&q=' + encodeURIComponent(q), {
                headers: { 'Accept-Language': 'pl' }
            });
            const j = await r.json();
            if (j && j.length > 0) return { lat: +j[0].lat, lon: +j[0].lon };
        } catch (err) { }
        return null;
    }

    async function searchStreets(q) {
        try {
            streetLayer.clearLayers();
            const b = map.getBounds();
            const bbox = `(${b.getSouth()},${b.getWest()},${b.getNorth()},${b.getEast()})`;
            const name = q.replace(/\\/g, '\\\\').replace(/"/g, '');
            const query = `[out:json][timeout:25];way["highway"]["name"~"${name}",i]${bbox};out geom;`;
            const r = await fetch('https://overpass-api.de/api/interpreter', {
                method: 'POST',
                body: 'data=' + encodeURIComponent(query)
            });
            const j = await r.json();
            const ways = (j.elements || []).filter(e => e.geometry && e.geometry.length).slice(0, 50);
            ways.forEach(w => {
                const pts = w.geometry.map(g => [g.lat, g.lon]);
                L.polyline(pts, { color: '#1e6bd6', weight: 5, opacity: 0.75 }).addTo(streetLayer);
            });
            if (ways.length > 0)
                map.fitBounds(streetLayer.getBounds().pad(0.15));
            return ways.length;
        } catch (err) {
            return 0;
        }
    }

    function openStreetView() {
        const ll = marker ? marker.getLatLng() : map.getCenter();
        if (window.chrome && window.chrome.webview) {
            window.chrome.webview.postMessage({
                type: 'streetview',
                lat: ll.lat, lng: ll.lng
            });
        }
    }

    document.getElementById('q').addEventListener('keydown', e => { if (e.key === 'Enter') search(); });

    if (window.chrome && window.chrome.webview) {
        window.chrome.webview.addEventListener('message', e => {
            const d = e.data;
            if (d && d.type === 'setView') setView(d.lat, d.lng, d.zoom);
        });
    }
</script>
</body>
</html>
