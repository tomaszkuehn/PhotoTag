<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8"/>
<title>PhotoTag mapa</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<style>
    html, body { height: 100%; margin: 0; font-family: 'Segoe UI', sans-serif; }
    #map { height: 100%; }
    #toolbar {
        position: absolute; top: 8px; left: 56px; right: 8px; z-index: 1000;
        display: flex; gap: 6px;
    }
    #q {
        flex: 1; max-width: 420px; padding: 7px 10px;
        border: 1px solid #999; border-radius: 6px; font-size: 13px;
    }
    #toolbar button {
        padding: 7px 14px; border: 1px solid #888; border-radius: 6px;
        background: #fff; cursor: pointer; font-size: 13px;
    }
    #toolbar button:hover { background: #eef6ff; }
    #coords {
        position: absolute; bottom: 8px; left: 8px; z-index: 1000;
        background: rgba(255,255,255,.95); padding: 6px 10px; border-radius: 6px;
        font-family: Consolas, monospace; font-size: 13px;
    }
</style>
</head>
<body>
<div id="toolbar">
    <input id="q" placeholder="Szukaj miejsca lub adresu…"/>
    <button onclick="search()">Szukaj</button>
</div>
<div id="map"></div>
<div id="coords">Kliknij na mapie, aby wybrać lokalizację</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
    const map = L.map('map').setView([52.0, 21.0], 6);
    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19, attribution: '&copy; OpenStreetMap'
    }).addTo(map);

    let marker = null;

    function setMarker(lat, lng) {
        if (marker) {
            marker.setLatLng([lat, lng]);
        } else {
            marker = L.marker([lat, lng], { draggable: true }).addTo(map);
            marker.on('dragend', post);
        }
        post();
    }

    function post() {
        if (!marker) return;
        const ll = marker.getLatLng();
        document.getElementById('coords').textContent =
            ll.lat.toFixed(6) + ', ' + ll.lng.toFixed(6);
        if (window.chrome && window.chrome.webview) {
            window.chrome.webview.postMessage({ type: 'pick', lat: ll.lat, lng: ll.lng });
        }
    }

    map.on('click', e => setMarker(e.latlng.lat, e.latlng.lng));

    function setView(lat, lng, zoom) {
        map.setView([lat, lng], zoom || 13);
        setMarker(lat, lng);
    }

    async function search() {
        const q = document.getElementById('q').value.trim();
        if (!q) return;
        try {
            const r = await fetch('https://nominatim.openstreetmap.org/search?format=json&limit=1&q=' + encodeURIComponent(q), {
                headers: { 'Accept-Language': 'pl' }
            });
            const j = await r.json();
            if (j && j.length > 0) {
                const lat = +j[0].lat, lon = +j[0].lon;
                map.setView([lat, lon], 13);
                setMarker(lat, lon);
            } else {
                document.getElementById('coords').textContent = 'Nie znaleziono: ' + q;
            }
        } catch (err) {
            document.getElementById('coords').textContent = 'Błąd wyszukiwania (brak sieci?)';
        }
    }

    document.getElementById('q').addEventListener('keydown', e => { if (e.key === 'Enter') search(); });

    if (window.chrome && window.chrome.webview) {
        window.chrome.webview.addEventListener('message', e => {
            const d = e.data;
            if (d && d.type === 'setView') setView(d.lat, d.lng, d.zoom);
        });
    }
</script>
</body>
</html>
